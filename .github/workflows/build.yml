name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  coverage:
    name: coverage-gcc-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build lcov zlib1g-dev libexpat1-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-g -O0 --coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage" \
            -DBUILD_SHARED_LIBS=ON -DUSE_CIFTI_CODE=ON -DUSE_FSL_CODE=ON
          cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

      - name: Coverage summary
        run: |
          lcov --capture --directory build --output-file coverage.info \
               --ignore-errors mismatch,gcov,source 2>/dev/null || true
          lcov --list coverage.info 2>/dev/null | tail -20 || echo "(no coverage data)"

  valgrind:
    name: valgrind-gcc-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libc6-dbg is not optional: without the C library's debug symbols
      # valgrind refuses to start, reporting that it cannot redirect memcmp.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build valgrind libc6-dbg zlib1g-dev libexpat1-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-g -O0" \
            -DBUILD_SHARED_LIBS=ON -DUSE_CIFTI_CODE=ON -DUSE_FSL_CODE=ON
          cmake --build build -j "$(nproc)"

      # --trace-children=yes matters: most of the tests are shell scripts
      # that exec nifti_tool, and without it valgrind inspects the shell and
      # reports a clean run having never looked at the library.
      # install_linking is excluded because it builds a whole CMake project,
      # and tracing cmake, make and cc1 through valgrind takes far longer
      # than it is worth.
      - name: Memcheck
        run: |
          ctest --test-dir build -T memcheck -j 4 -E install_linking \
            --overwrite MemoryCheckCommandOptions="--trace-children=yes --leak-check=full --show-leak-kinds=definite,indirect --error-exitcode=42"

      # ctest -T memcheck exits 0 even when valgrind reports defects, so
      # check the logs rather than trusting the exit status.
      # Two things make this fiddlier than it looks.  With --trace-children
      # each log holds one ERROR SUMMARY per process, so a per-file "does it
      # contain a clean summary" test is not enough.  And because those
      # processes run concurrently and share one log, their lines interleave:
      # a real run produced "==3336== ERROR SUMMARY: ==3300==", one process
      # cut off mid-line by another.  So match the count itself rather than
      # the absence of the clean string, which a spliced line also satisfies.
      - name: Fail on any valgrind defect
        run: |
          logs=$(ls build/Testing/Temporary/MemoryChecker.*.log)
          bad=$(grep -HE "ERROR SUMMARY: [1-9][0-9]* errors" $logs || true)
          leaks=$(grep -HE "(definitely|indirectly) lost: [1-9]" $logs || true)
          if [ -n "$bad" ] || [ -n "$leaks" ]; then
            echo "::error::valgrind reported defects"
            printf '%s\n' "$bad" "$leaks"
            for f in $(printf '%s\n' "$bad" "$leaks" | cut -d: -f1 | sort -u); do
              [ -n "$f" ] || continue
              echo "===== $f"; cat "$f"
            done
            exit 1
          fi
          echo "valgrind clean across $(printf '%s\n' $logs | wc -l) tests"

      - name: Upload memcheck logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memcheck-logs
          path: build/Testing/Temporary/MemoryChecker.*.log
          if-no-files-found: ignore

  use_prefix:
    name: use_prefix-gcc-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build zlib1g-dev libexpat1-dev

      # Exercises the NIFTI_PACKAGE_PREFIX path used when this library is
      # vendored into a larger project that already links a system nifti.
      - name: Build and test with a package prefix
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNIFTI_PACKAGE_PREFIX=vendored_ \
            -DBUILD_SHARED_LIBS=ON -DUSE_CIFTI_CODE=ON -DUSE_FSL_CODE=ON
          cmake --build build -j "$(nproc)"
          ctest --test-dir build --output-on-failure -j 4

  sanitize:
    name: sanitize-clang-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang clang-tools zlib1g-dev libexpat1-dev

      - name: Build and test with ASan and UBSan
        env:
          CC: clang
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBUILD_SHARED_LIBS=ON -DUSE_CIFTI_CODE=ON -DUSE_FSL_CODE=ON
          cmake --build build -j "$(nproc)"
          ctest --test-dir build --output-on-failure -j 4

      # scan-build needs its own configure, since it wraps the compiler.
      - name: clang static analyzer
        env:
          CC: clang
        run: |
          scan-build --status-bugs -o scan-results \
            cmake -S . -B build-scan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              -DUSE_CIFTI_CODE=ON -DUSE_FSL_CODE=ON
          scan-build --status-bugs -o scan-results \
            cmake --build build-scan -j "$(nproc)"

  macos:
    name: rel-clang-macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ninja

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DUSE_CIFTI_CODE=ON -DUSE_FSL_CODE=ON
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          ctest --test-dir build --output-on-failure -j 4
