# Per-PR build and test matrix; one line per axis:
#   os / c_compiler  GNU, Clang, and AppleClang (macOS gcc is a clang shim).
#   shared           BUILD_SHARED_LIBS=ON also enables the install and export test.
#   fslstyle         -DFSLSTYLE changes behavior and on-disk output, so both values run.
#   build_type       one static Debug leg makes the library's assert() sites live.

name: CMake on multiple platforms

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.c_compiler }} ${{ matrix.build_type }} shared=${{ matrix.shared }} fslstyle=${{ matrix.fslstyle }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        c_compiler: [gcc, clang]
        build_type: [Release]
        shared: ["OFF", "ON"]
        fslstyle: ["OFF", "ON"]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          # Single Debug leg; FSLSTYLE=ON reaches the asserts behind those defines.
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug
            shared: "OFF"
            fslstyle: "ON"
        exclude:
          # /usr/bin/gcc on macOS is a clang shim, so this would duplicate the clang leg.
          - os: macos-latest
            c_compiler: gcc

    steps:
    - uses: actions/checkout@v4

    - name: Install optional dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libexpat1-dev zlib1g-dev

    - name: Set reusable strings
      id: strings
      shell: bash
      run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_SHARED_LIBS=${{ matrix.shared }}
        -DUSE_CIFTI_CODE=ON
        -DUSE_FSL_CODE=ON
        -DFSLSTYLE=${{ matrix.fslstyle }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

  minimal:
    # The core-reader-only configuration a vendoring project selects.
    name: minimal configuration (znzlib + niftilib only)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=Release
        -DUSE_NIFTI2_CODE=OFF
        -DUSE_NIFTICDF_CODE=OFF
        -DUSE_CIFTI_CODE=OFF
        -DUSE_FSL_CODE=OFF
        -DNIFTI_BUILD_APPLICATIONS=OFF
        -DDOWNLOAD_TEST_DATA=OFF
        -S ${{ github.workspace }}
    - name: Build
      run: cmake --build ${{ github.workspace }}/build
    - name: Test
      working-directory: ${{ github.workspace }}/build
      # No tests are registered without the applications; the job checks configure and build.
      run: ctest --output-on-failure --no-tests=ignore

  oldest-cmake:
    # Builds with the cmake_minimum_required release; the data tests need FetchContent (3.11).
    name: oldest supported CMake (3.10.2, tests without data)
    runs-on: ubuntu-24.04
    env:
      CMAKE_OLDEST: 3.10.2
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libexpat1-dev zlib1g-dev
    - name: Install CMake ${{ env.CMAKE_OLDEST }}
      run: |
        curl -sSfL -o "$RUNNER_TEMP/cmake.tar.gz" \
          "https://github.com/Kitware/CMake/releases/download/v${CMAKE_OLDEST}/cmake-${CMAKE_OLDEST}-Linux-x86_64.tar.gz"
        tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/cmake-${CMAKE_OLDEST}-Linux-x86_64/bin" >> "$GITHUB_PATH"
    - name: Show CMake version
      run: cmake --version | grep -F "cmake version ${CMAKE_OLDEST}"
    - name: Configure CMake
      run: >
        cmake -B${{ github.workspace }}/build
        -H${{ github.workspace }}
        -DCMAKE_BUILD_TYPE=Release
        -DUSE_CIFTI_CODE=ON
        -DUSE_FSL_CODE=ON
        -DDOWNLOAD_TEST_DATA=OFF
    - name: Build
      run: cmake --build ${{ github.workspace }}/build -- -j4
    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure -LE NEEDS_DATA

  exported-symbols:
    # An intended ABI change updates the baseline in the same commit, so review sees it.
    name: exported symbol baseline
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libexpat1-dev zlib1g-dev ninja-build
    - name: Configure CMake
      run: >
        cmake -G Ninja -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_SHARED_LIBS=ON
        -DUSE_CIFTI_CODE=ON
        -DUSE_FSL_CODE=ON
        -S ${{ github.workspace }}
    - name: Build
      run: cmake --build ${{ github.workspace }}/build
    - name: Collect exported symbols
      run: |
        sh cmake/collect_exported_symbols.sh \
             "${{ github.workspace }}/build" \
             /tmp/exported_symbols.txt
    - name: Compare against the committed baseline
      run: |
        if ! diff -u cmake/exported_symbols_linux.txt /tmp/exported_symbols.txt; then
          echo ""
          echo "The exported symbol set changed."
          echo "If that is intended, update cmake/exported_symbols_linux.txt"
          echo "in this commit so the ABI change is visible in review:"
          echo "  sh cmake/collect_exported_symbols.sh <build-dir> cmake/exported_symbols_linux.txt"
          exit 1
        fi
        echo "Exported symbols match the baseline."
